version: "3.9"

# Sidecars for claw's router integration.
#
# Data flow:  claw  ->  gptcache (semantic cache)  ->  routellm (routing)  ->  upstream providers
#
# claw points at gptcache via .claw.json:
#   {
#     "router": {
#       "enabled": true,
#       "baseUrl": "http://127.0.0.1:8100/v1",
#       "apiKey": "sk-router",
#       "model": "router-mf-0.11593"
#     }
#   }
#
# Bring up:   docker compose -f deploy/router/docker-compose.yml up -d
# Tear down:  docker compose -f deploy/router/docker-compose.yml down
#
# Evaluation: RouteLLM ships its own eval scripts. Inside the routellm
# container run:
#   python -m routellm.evals.evaluate --routers mf --strong-model claude-opus-4-6 --weak-model claude-haiku-4-5 --benchmark mt-bench
# Results are written to routellm/evals/results/ in the mounted volume.

services:
  routellm:
    image: ghcr.io/lm-sys/routellm:latest
    container_name: claw-routellm
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
    command:
      - python
      - -m
      - routellm.openai_server
      - --routers
      - mf
      - --strong-model
      - claude-opus-4-6
      - --weak-model
      - claude-haiku-4-5
      - --port
      - "6060"
    ports:
      - "6060:6060"
    volumes:
      - routellm-results:/app/routellm/evals/results
    restart: unless-stopped

  gptcache:
    image: zilliz/gptcache:latest
    container_name: claw-gptcache
    environment:
      - CACHE_BACKEND=sqlite
      - UPSTREAM_BASE_URL=http://routellm:6060/v1
      - UPSTREAM_API_KEY=dummy
    ports:
      - "8100:8000"
    depends_on:
      - routellm
    volumes:
      - gptcache-data:/data
    restart: unless-stopped

volumes:
  routellm-results:
  gptcache-data:
