version: "3.9"

# Optional sidecars for claw's router.
#
# Required only when `router.mode = "external"` in .claw.json. The
# `eval-driven` mode runs entirely in-process and does not need either
# service — see deploy/router/README.md.
#
# External-mode data flow:
#   claw --> gptcache:8100 --> routellm:6060 --> upstream providers
#
# Bring up:   docker compose -f deploy/router/docker-compose.yml up -d
# Tear down:  docker compose -f deploy/router/docker-compose.yml down
#
# To run gptcache alone (cache only, no RouteLLM):
#   docker compose -f deploy/router/docker-compose.yml up -d gptcache-direct

services:
  routellm:
    image: ghcr.io/lm-sys/routellm:latest
    container_name: claw-routellm
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
    command:
      - python
      - -m
      - routellm.openai_server
      - --routers
      - mf
      - --strong-model
      - claude-opus-4-6
      - --weak-model
      - claude-haiku-4-5
      - --port
      - "6060"
    ports:
      - "6060:6060"
    volumes:
      - routellm-results:/app/routellm/evals/results
    restart: unless-stopped

  gptcache:
    image: zilliz/gptcache:latest
    container_name: claw-gptcache
    environment:
      - CACHE_BACKEND=sqlite
      - UPSTREAM_BASE_URL=http://routellm:6060/v1
      - UPSTREAM_API_KEY=dummy
    ports:
      - "8100:8000"
    depends_on:
      - routellm
    volumes:
      - gptcache-data:/data
    restart: unless-stopped

volumes:
  routellm-results:
  gptcache-data:
